function stampName(){return new Date(Date.now()-7*3600e3).toISOString().slice(0,16).replace('T','-').replace(':','')}
function whoSlug(){const w=(STORE.who()||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');return w?w+'-':''}
function exportChanges(){if(!STORE.pendingTotal()&&!STORE.editedJobs().length){toast('No edits to export yet');return}const x=STORE.exportFiles();download(`Harswells-changes-${whoSlug()}${stampName()}.zip`,x.zip)}
function exportJson(){const o=STORE.exportObj();download(`Harswells-changes-${whoSlug()}${stampName()}.json`,JSON.stringify(o,null,1),'application/json')}
function importFile(file){const r=new FileReader();r.onload=()=>{try{const res=STORE.importBuffer(r.result);J=null;route();
  toast(`Imported ${res.added} edit(s) in ${res.jobs} job(s)`+(res.failed?` · ${res.failed} could not be applied (see History)`:'')+(res.otherSnapshot?' · note: made on a different snapshot':''))}catch(e){toast('Import failed: '+e.message)}};r.onerror=()=>toast('Could not read that file');r.readAsArrayBuffer(file)}
function ensureName(then){if(STORE.who()){then();return}openModal(`<h2>Your name</h2><p class="small mut">Shown on your edits, exports and check-outs so the office knows who changed what.</p><form id="wf"><input name="n" placeholder="Your first name" required style="width:100%" autocomplete="name"><div class="mbtns"><button class="pri" type="submit">Continue</button><span class="sp"></span><button type="button" data-close>Cancel</button></div></form>`,
 m=>{m.querySelector('#wf').onsubmit=e=>{e.preventDefault();STORE.setWho(new FormData(e.target).get('n'));closeModal();then()}})}
function openChanges(){const eds=STORE.editedJobs();const n=STORE.pendingTotal();const names=Object.fromEntries(((DATA.common||{}).all_jobs||[]).map(x=>[x.slug,x.name]));const others=STORE.otherVersions();
 const co=J&&syncOn()?STORE.checkout(J.slug):null;const ls=J&&lockCache[J.slug];
 openModal(`<h2>My changes</h2>
 <label class="small">Your name <input id="whoin" value="${esc(STORE.who())}" placeholder="Your first name" style="width:160px" autocomplete="name"></label>
 <p class="small">${STORE.persist?`Saved in this browser (localStorage, key <code>${esc(STORE.KEY)}</code>).`:'<b class="red">This viewer blocks storage: edits are lost when you close it. Export them first.</b>'} <b>${n}</b> unsent edit${n==1?'':'s'}${eds.length?' in '+eds.length+' job'+(eds.length>1?'s':''):''}.</p>
 ${eds.length?`<div class="list">${eds.map(s=>`<div class="it"><div class="bd"><a href="${jobHref(s)}" data-close class="t">${esc(names[s]||s)}</a> <span class="small mut">${STORE.pending(s)} unsent</span></div><button class="small" data-rj="${esc(s)}">Reset job</button></div>`).join('')}</div>`:''}
 ${others.length?`<div class="note small">Edits from an older snapshot/version are still in this browser (${others.map(o=>o.n+' from '+esc(o.built||'?')).join(', ')}). <button class="small" id="adopt">Bring them over</button></div>`:''}
 <div class="mbtns"><button class="pri" id="xc">Export my changes</button><button id="xj">JSON only</button><label class="btn filebtn">Import changes<input type="file" id="imp" accept=".json,.zip,application/json,application/zip" hidden></label><span class="sp"></span><button class="danger" id="rst">Reset to original</button></div>
 <h3 class="sh">Shared check-out <span class="mut small">(optional; lets your team take turns editing a job)</span></h3>
 <div class="small">${syncOn()?`Connected: <b>${esc(SY.A.describe())}</b>`:(SY.A&&SY.A.needsPermission()?`Folder access needs your OK again.`:'Not connected: edits stay in this browser until you export them.')}</div>
 ${J&&syncOn()?`<div class="small" style="margin-top:6px">${esc(J.name)}: ${co&&co.kind==SY.kind?`<b>checked out by you</b> since ${esc(co.lock.checked_out_at)} (expires ${esc(co.lock.expires_at)})`:(ls?(ls.state=='free'?'available':(ls.state=='other'?`checked out by <b>${esc(ls.lock.holder)}</b> since ${esc(ls.lock.checked_out_at)}`:(ls.state=='expired'?`lock by ${esc(ls.lock.holder)} expired`:'')))  :'checking…')}</div>
  <div class="mbtns">${co&&co.kind==SY.kind?`<button class="pri" id="sci">Check in${J.pending?' ('+J.pending+')':''}</button><button id="srl">Cancel check-out</button>`:`<button class="pri" id="sco">Check out ${esc(J.name)}</button>`}<button id="spl">Refresh</button></div>`:''}
 <div class="mbtns">${syncOn()||(SY.A&&SY.A.needsPermission())?`${SY.A&&SY.A.needsPermission()?'<button class="pri" id="sgrant">Allow folder access</button>':''}<button id="sdis">Disconnect ${esc(SY.A.label)}</button>`:`${HWSSync.FsaBackend().available()?'<button id="sfsa">Use a shared folder…</button>':''}<button id="sdbx">Sign in with Dropbox</button>`}</div>
 <p class="small mut">${MODE==='share'?'Shared folder works in desktop Chrome/Edge (pick the Dropbox-synced “Harswells Live Schedule/sync” folder). Dropbox sign-in from this file opens Dropbox in a new tab and asks you to paste the code it shows. On iPhone use the hosted app.':'Dropbox sign-in keeps your check-outs and change sets in the shared Dropbox folder (locks/ and changes/ folders).'}</p>
 <div class="mbtns"><span class="sp"></span><button data-close>Close</button></div>`,m=>{
  const g=s=>m.querySelector(s);g('#whoin').onchange=e=>{STORE.setWho(e.target.value);toast('Name saved')};
  g('#xc').onclick=exportChanges;g('#xj').onclick=exportJson;g('#imp').onchange=e=>{const f=e.target.files[0];if(f){closeModal();importFile(f)}};
  g('#rst').onclick=()=>{if(confirm('Reset to the original snapshot? This deletes every unsent edit in this browser (export first if you need them).')){STORE.reset();closeModal();J=null;route();toast('Reset to the original snapshot')}};
  m.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{if(confirm('Discard your unsent edits for this job?')){STORE.reset(b.dataset.rj);closeModal();J=null;route();toast('Job reset')}});
  const ad=g('#adopt');if(ad)ad.onclick=()=>{others.forEach(o=>STORE.adoptVersion(o.key));closeModal();J=null;route();toast('Older edits brought over (check History for anything that could not apply)')};
  const b=(id,f)=>{const x=g(id);if(x)x.onclick=f};
  b('#sco',()=>{closeModal();doCheckout(J.slug)});b('#sci',()=>{closeModal();doCheckin(J.slug)});b('#srl',()=>{closeModal();doRelease(J.slug)});b('#spl',()=>{closeModal();refreshLock(J.slug,true).then(()=>openChanges())});
  b('#sfsa',async()=>{try{await setBackend('fsa',true);closeModal();J=null;route();toast('Shared folder connected')}catch(e){if(e.name!='AbortError')toast('Folder: '+e.message)}});
  b('#sgrant',async()=>{try{await SY.A.connect();closeModal();J=null;route()}catch(e){toast(e.message)}});
  b('#sdbx',async()=>{try{const r=await setBackend('dropbox',true);if(r=='paste'){closeModal();pasteCode()}else if(r!=='redirect'){closeModal();J=null;route()}}catch(e){toast(e.message)}});
  b('#sdis',async()=>{if(!confirm('Disconnect? Unsent edits stay in this browser.'))return;await SY.A.disconnect();HWSSync.LS.set('hws-sync-kind',null);SY.A=null;SY.kind=null;SY.locks=null;closeModal();J=null;route()})})}
function pasteCode(){openModal(`<h2>Finish Dropbox sign-in</h2><p class="small">Dropbox opened in a new tab. Approve access, then copy the code it shows and paste it here.</p><form id="pc"><input name="c" required style="width:100%" autocomplete="off" placeholder="Access code"><div class="mbtns"><button class="pri" type="submit">Sign in</button><span class="sp"></span><button type="button" data-close>Cancel</button></div></form>`,
 m=>{m.querySelector('#pc').onsubmit=async e=>{e.preventDefault();try{await SY.A.finishPaste(new FormData(e.target).get('c'));closeModal();J=null;route();toast('Signed in to Dropbox')}catch(err){toast(err.message)}}})}
/* ---------- sync state ---------- */
const SY={A:null,kind:null,locks:null};const lockCache={};
async function setBackend(kind,interactive){const A=kind=='fsa'?HWSSync.FsaBackend():HWSSync.DropboxBackend();HWSSync.LS.set('hws-sync-kind',kind);
 let r=true;if(interactive){if(kind=='dropbox'&&!A.configured()){HWSSync.LS.set('hws-sync-kind',null);throw new Error('Dropbox sign-in is not set up in this build yet (Dropbox App key missing; see DEPLOY.md).')}r=await A.connect()}else await A.restore();
 SY.A=A;SY.kind=kind;SY.locks=HWSSync.Locks(A,{who:()=>STORE.who(),built:DATA.built});return r}
async function syncRedirect(){if(HWSSync.LS.get('hws-sync-kind')!=='dropbox')return;try{const A=HWSSync.DropboxBackend();if(await A.handleRedirect())toast('Signed in to Dropbox'+(A.describe()?': '+A.describe():''))}catch(e){toast(e.message)}}
async function syncBoot(){const kind=HWSSync.LS.get('hws-sync-kind');if(!kind)return;const A=kind=='fsa'?HWSSync.FsaBackend():HWSSync.DropboxBackend();
 try{await A.restore()}catch(e){}SY.A=A;SY.kind=kind;SY.locks=HWSSync.Locks(A,{who:()=>STORE.who(),built:DATA&&DATA.built})}
async function refreshLock(slug,force){if(!syncOn())return;if(!force&&lockCache[slug]&&Date.now()-lockCache[slug].at<60e3)return;try{const s=await SY.locks.status(slug);s.at=Date.now();lockCache[slug]=s;
  const co=STORE.checkout(slug);if(co&&co.kind==SY.kind&&s.state!='mine'){STORE.setCheckout(slug,null);toast('Your check-out of this job is no longer valid'+(s.lock?` (${s.lock.holder} has it)`:''))}
  if(J&&J.slug==slug&&!modalEl)renderJob()}catch(e){lockCache[slug]={state:'unknown',at:Date.now()}}}
async function doCheckout(slug,force){if(!syncOn()){openChanges();return}ensureName(async()=>{busy(true);try{const r=await SY.locks.checkout(slug,force);
  const sets=await SY.locks.pull(slug,STORE.knownRemote(slug));const n=STORE.mergeRemote(slug,sets);STORE.setCheckout(slug,{kind:SY.kind,rev:r.rev,lock:r.lock,at:Date.now()});lockCache[slug]={state:'mine',lock:r.lock,rev:r.rev,at:Date.now()};
  if(J&&J.slug==slug)J=STORE.getJob(slug);renderJob();toast(`Checked out · you can edit ${J.name}`+(n?` · pulled ${n} change set(s) from others`:''))}
 catch(e){if(e.name=='LockedError'){const lk=e.lock||{};const exp=Date.now()>(lk.expires_ms||0);lockCache[slug]={state:exp?'expired':'other',lock:lk,at:Date.now()};renderJob();
   openModal(`<h2>${esc(J?J.name:slug)} is checked out</h2><p><b>${esc(lk.holder||'Someone')}</b> checked it out ${esc(lk.checked_out_at||'')}${lk.expires_at?` (expires ${esc(lk.expires_at)})`:''}.</p><p class="small mut">Wait for them to check in, or take over if they are done${exp?' (their check-out has expired)':''}. Taking over is recorded; their un-checked-in edits stay on their device.</p><div class="mbtns"><button class="danger" id="tko">Take over</button><span class="sp"></span><button data-close>OK</button></div>`,
   m=>m.querySelector('#tko').onclick=()=>{if(exp||confirm(`Take over from ${lk.holder}?`)){closeModal();doCheckout(slug,true)}})}
  else if(e.name=='SetupError')setupFolder(slug,e);else toast('Check-out failed: '+e.message)}finally{busy(false)}})}
function setupFolder(slug,e){openModal(`<h2>Check-out folder not found</h2><p>${esc(e.message)}</p><p class="small mut">Everyone must use the <b>same</b> folder. <b>Folder owner:</b> tap “Create it here” once. <b>Everyone else:</b> ask the folder owner to share the <code>Harswells Live Schedule/sync</code> folder with you (can edit), add it to your Dropbox, then enter where it appears in your Dropbox (for example <code>/sync</code> or <code>/Harswells Live Schedule/sync</code>).</p><form id="sfr"><label class="small">Folder path in this Dropbox<input name="p" value="${esc(e.where||'')}" style="width:100%" autocomplete="off"></label><div class="mbtns"><button class="pri" type="submit">Use this folder</button><button type="button" id="smk">Create it here</button><span class="sp"></span><button type="button" data-close>Cancel</button></div></form>`,
 m=>{m.querySelector('#sfr').onsubmit=ev=>{ev.preventDefault();SY.A.setRoot(new FormData(ev.target).get('p'));closeModal();doCheckout(slug)};
  m.querySelector('#smk').onclick=async()=>{const p=m.querySelector('[name=p]').value;if(p&&p!==e.where)SY.A.setRoot(p);closeModal();busy(true);try{await SY.A.ensureLayout(true);doCheckout(slug)}catch(err){toast('Could not create the folder: '+err.message)}finally{busy(false)}}})}
async function doCheckin(slug){const co=STORE.checkout(slug);if(!co){toast('Not checked out');return}busy(true);try{const cs=STORE.changeset(slug);const r=await SY.locks.checkin(slug,cs,co);
  if(r.name)STORE.markCheckedIn(slug,cs,r.name);STORE.setCheckout(slug,null);lockCache[slug]={state:'free',at:Date.now()};if(J&&J.slug==slug)J=STORE.getJob(slug);renderJob();
  toast((r.name?`Checked in ${cs.entries.length} edit(s)`:'Checked in (no edits)')+(r.warning?' · '+r.warning:''))}
 catch(e){toast('Check-in failed: '+e.message+'. Your edits stay saved here; try again when online.')}finally{busy(false)}}
async function doRelease(slug){const co=STORE.checkout(slug);if(STORE.pending(slug)&&!confirm('You have unsent edits. Cancel the check-out anyway? (The edits stay in this browser; check out again later to check them in.)'))return;
 busy(true);try{await SY.locks.release(slug,co)}catch(e){if(e.name!='ConflictError'){toast('Could not release: '+e.message);busy(false);return}}STORE.setCheckout(slug,null);lockCache[slug]={state:'free',at:Date.now()};if(J&&J.slug==slug)renderJob();toast('Check-out cancelled');busy(false)}
let busyN=0;function busy(on){busyN+=on?1:-1;document.body.classList.toggle('busy',busyN>0)}
/* ---------- landing (all jobs) ---------- */
function renderList(){if(!L){$('#root').innerHTML=topHtml()+'<div class="empty"><b>No data yet.</b></div>';bindTop();return}const q=(st.lq||'').toLowerCase();const jobs=L.jobs.filter(j=>!q||(j.name+' '+j.address+' '+j.stage).toLowerCase().includes(q));
 const hi=L.jobs.reduce((a,j)=>a+j.high,0),od=L.jobs.reduce((a,j)=>a+j.overdue,0);document.body.classList.remove('has-tabs');
 $('#root').innerHTML=topHtml()+`<main class="main" style="max-width:1400px;margin:0 auto"><div class="lcards"><div class="lcard"><div class="n">${L.jobs.length}</div><div class="b">Jobs</div><div class="small mut">each has its own schedule workspace</div></div>
 <div class="lcard red"><div class="n">${od}</div><div class="b">Overdue tasks</div><div class="small mut">not complete, past finish</div></div><div class="lcard red"><div class="n">${hi}</div><div class="b">High conflicts</div><div class="small mut">across all jobs</div></div>
 <div class="lcard"><div class="n">${L.jobs.filter(j=>j.tasks).length}</div><div class="b">Jobs with a schedule</div><div class="small mut">${L.jobs.filter(j=>j.bt).length} from Buildertrend</div></div></div>
 <div class="panel"><h3>Job workspaces <span class="mut small">status date ${mdy(L.today)}</span><span class="sp"></span><input type="search" id="lq" placeholder="Find a job" value="${esc(st.lq||'')}"></h3><div class="pb"><div class="jgrid">
 ${jobs.map(j=>{const pe=STORE.pending(j.slug);return `<a class="jcard" href="${jobHref(j.slug)}"><h4>${esc(j.name)}${pe?' '+chip(pe+' unsent','medium'):''}</h4><div class="small mut">${esc(j.address||'address not on file')}</div><div class="row"><span>${chip(j.stage||'—','low')}</span><span>${chip(j.bt_status=='in Buildertrend'?'BT':'not in BT',j.bt_status=='in Buildertrend'?'inbt':'notbt')}</span></div>
 <div class="row"><span>${j.start?mdy(j.start)+' → '+mdy(j.finish):'<span class="mut">no schedule yet</span>'}</span><span><span class="pbar" style="width:70px"><b style="width:${j.pct}%"></b></span> ${j.pct}%</span></div>
 <div class="row"><span class="mut">${j.tasks} tasks${j.pm?' · PM '+esc(j.pm):''}</span><span>${j.overdue?chip(j.overdue+' overdue','overdue'):''} ${j.high?chip(j.high+' high','high'):''}</span></div>
 ${j.next?`<div class="small mut" style="margin-top:4px">Next: ${md(j.next.date)} ${esc(j.next.task)}</div>`:''}</a>`}).join('')||emptyState('No jobs match','')}</div></div></div></main>`;
 bindTop();const lq=$('#lq');lq.oninput=e=>{st.lq=e.target.value;saveUi();const p=lq.selectionStart;renderList();const n=$('#lq');n.focus();try{n.setSelectionRange(p,p)}catch(_){}};document.title='Harswells · Job workspaces'}
/* ---------- boot ---------- */
function route(){closeModal();if(!DATA)return;const p=parseHash();
 if(p.slug){if(!DATA.jobs[p.slug]){location.hash='#/';return}if(!J||J.slug!=p.slug)J=STORE.getJob(p.slug);L=null;renderJob();window.scrollTo(0,0)}
 else{J=null;L=STORE.getList();renderList()}}
window.addEventListener('hashchange',route);
let lastPhone=isPhone();window.addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;if(!modalEl)route()}});
function openStore(){STORE=HWSStore.create({data:DATA,version:MODE==='share'?B.version:('pwa-'+String(DATA.built).replace(/[^0-9A-Za-z]+/g,'')),extra:DATA.extra,onSaveError:e=>toast('Could not save in this browser: '+e.message+' (export your changes)')})}
async function boot(){try{
  await syncRedirect();
  if(MODE==='share'){const el=document.getElementById('hws-data');DATA=JSON.parse(el.textContent);el.textContent='';}
  else{await WSData.init();WSData.onUpdate=()=>{const pend=STORE?STORE.pendingTotal():0;DATA=WSData.data();openStore();J=null;route();if(pend&&!STORE.pendingTotal())toast('New data arrived; open “Changes” to bring your unsent edits over')};DATA=WSData.data();
   if(!DATA){$('#root').innerHTML=topHtml()+`<div class="main">${WSData.errorHtml({message:'setup'})}</div>`;WSData.bind();await syncBoot();return}}
  openStore();await syncBoot();route();
 }catch(e){console.error(e);$('#root').innerHTML='<div class="empty"><b>Could not start the app.</b>'+esc(e.message)+'</div>'}}
if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body></html>
