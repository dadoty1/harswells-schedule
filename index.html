/* Attention screen (owner request 9/27 7:51 PM): ONE place for what needs attention today vs this week. Phone-first.
   Four parts, each drills down count -> list -> item (with actions on the same tap; no dead-end numbers, 7:52 PM):
     1. Today / This week   tasks starting, due or overdue, inspections, bids and follow-ups due; deliveries = info only
     2. Drifting jobs       current finish - baseline finish (baseline.json, proposed until the owner approves), green 0-2 / amber 3-7 / red >7
     3. Assigned            job -> PM, crew, subs/vendors (Buildertrend + trackers), with call/text/email where a number/email is on file
     4. Quiet jobs          active jobs with no activity for 7+ days (hub edits, Dropbox job folder, messages, daily logs, BT)
   Item actions: Reschedule (same engine op as drag-reschedule: cascades, History, Undo), Message (sms:/mailto: composer only; the app
   never sends), Flag (+ note; saved to the job's shared settings, listed under Flagged).
   Cross-links (standing rule 8): every item carries links [{type,id|url,label}] rendered by the shared Related panel (HWSRelated).
   Data: DATA.common.attention (built by bt_nightly.py; only in the Dropbox data file, never in this shell). Draft template rows are
   excluded from every count. */
const ATT_KEYS={today:'Today',week:'This week',overdue:'Overdue',critical:'Critical',inspections:'Inspections',deliveries:'Deliveries',
 drift:'Drifting jobs',red:'Red drift (>7 days)',amber:'Amber drift (3–7 days)',green:'On baseline (0–2 days)',quiet:'Quiet jobs',flagged:'Flagged',assigned:'Assigned',stale:'Schedules not updated',nobase:'No baseline, no schedule'};
function AT(){return (DATA&&DATA.common&&DATA.common.attention)||null}
function attToday(){return iso(Date.now()-7*3600e3)}
function attJ(slug){try{return STORE?STORE.getJob(slug):DATA.jobs[slug]}catch(e){return DATA.jobs[slug]}}
function attDraft(t){return String(t.source||'').toUpperCase()=='DRAFT'&&!/^Added in the job workspace/.test(t.source_ref||'')}
function attReal(t){return t&&!attDraft(t)&&String(t.source||'').toUpperCase()!='TRACKER'}
function attDone(t){return !!(t.done||/^(complete|done)/i.test(t.status||'')||+t.pct_complete>=100)}
function attDays(a,b){return Math.round((dP(b)-dP(a))/DAY)}
function attColor(n){return n==null?'none':(n<=2?'green':(n<=7?'amber':'red'))}
function attSlugs(){return Object.keys(DATA.jobs||{})}
function attInfo(slug){const J=attJ(slug);return (J&&J.info)||{}}
function attBase(slug){const a=AT();return a&&a.baseline&&a.baseline.jobs&&a.baseline.jobs[slug]||null}
function attStale(slug){const b=attBase(slug);return !!(b&&b.quality=='stale')}
function attActive(slug){const J=attJ(slug)||{};const s=String(attInfo(slug).status||'');const closed=(DATA&&DATA.common&&DATA.common.closed_jobs)||[];if(closed.indexOf(slug)>=0||/inactive|complete|closed|on hold|lost/i.test(s))return false;if(/active|building|construction/i.test(s))return true;
 return slug!='general'&&!/complet|closeout|overhead|company/i.test(J.stage||'')}
function attOwn(){return (AT()&&AT().owner)||{}}

function attIsOwner(){try{const O=attOwn();if(!O.match)return false;const re=new RegExp(O.match,'i');const d=(SY&&SY.A&&SY.A.describe)?SY.A.describe():'';const w=STORE&&STORE.who?STORE.who():'';return re.test(d)||re.test(w)}catch(e){return false}}

function attItems(){const td=attToday(),we=addD(td,7),A=AT();const items=[];const h=H();
 attSlugs().forEach(slug=>{if(!attActive(slug))return;const J=attJ(slug);if(!J)return;const stale=attStale(slug);
  (J.tasks||[]).forEach(t=>{if(!attReal(t)||attDone(t)||!t.start)return;const f=t.finish||t.start;
   const insp=t.milestone_type=='inspection'||/inspect/i.test(t.task||'');const flag=attFlag(slug,t.id);
   let when=null,why='';
   if(f<td){when='today';why=`Overdue: was due ${md(f)} (${attDays(f,td)}d ago)`}
   else if(t.start==td&&f==td){when='today';why=insp?'Inspection today':'Today'}
   else if(t.start==td){when='today';why=insp?'Inspection starts today':'Starts today'}
   else if(f==td){when='today';why='Due today'}
   else if(t.start<td&&f>td&&(insp||flag)){when='today';why='In progress'}
   else if(t.start>td&&t.start<=we){when='week';why=(insp?'Inspection ':'Starts ')+dow(t.start)+' '+md(t.start)}
   else if(f>td&&f<=we){when='week';why='Due '+dow(f)+' '+md(f)}

   const overdue=f<td;let sev=overdue?(t.critical?1:2):(when=='today'?(insp?2:3):4);if(flag)sev=Math.min(sev,1);
   items.push({kind:insp?'inspection':'task',when,sev,date:overdue?f:(t.start>=td?t.start:f),slug,job:J.name,title:t.task,id:t.id,t,why,overdue,critical:!!t.critical,insp,flag,src:t.source})})});

function relTime(ms){const s=Math.max(0,(Date.now()-ms)/1000);if(s<45)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';const d=new Date(ms);const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});return (s<20*3600?'at ':d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',timeZone:'America/Phoenix'})+' ')+t}
function liveBadge(slug){const s=LIVE?LIVE.status():{state:'connecting'};const q=STORE?STORE.pendingTotal():0;
