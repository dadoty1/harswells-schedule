<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15233b" />
  <title>Plan Room</title>
  <style>
  #hws-bar > #hws-rotate{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #fff;background:transparent;color:#fff;font:15px/1.3 -apple-system,"Segoe UI",sans-serif;font-weight:700}
  </style>
  <script>
  /* Keep the PDF bytes the viewer downloads so the text index can run
     without a second full fetch. Dropbox JSON downloads are ignored. */
  (function () {
    var orig = window.fetch;
    window.fetch = function (input, init) {
      return orig.apply(this, arguments).then(function (res) {
        try {
          var arg = "";
          var headers = init && init.headers;
          if (headers) {
            if (typeof headers.get === "function") arg = headers.get("Dropbox-API-Arg") || "";
            else arg = headers["Dropbox-API-Arg"] || "";
          }
          var url = typeof input === "string" ? input : (input && input.url) || "";
          var pdf = /\.pdf(\?|$)/i.test(url) || /\.pdf"/.test(arg) || /\.pdf}/.test(arg);
          if (pdf && res && res.ok && !window.__hwsPdfBytes) {
            res.clone().arrayBuffer().then(function (buf) {
              window.__hwsPdfBytes = buf;
              window.dispatchEvent(new Event("hws-pdf-bytes"));
            }).catch(function () {});
          }
        } catch (e) {}
        return res;
      });
    };
  })();
  </script>
  <script type="module" src="./chrome.js"></script>
  <script type="module" crossorigin src="./assets/index-Bs_pDpiY.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B7b6-uFn.css">
  <link rel="stylesheet" href="./chrome.css">
  <link rel="stylesheet" href="./planview.css">
</head>
<body>
  <div id="hws-bar">
    <a id="hws-back" href="../../index.html" aria-label="Back">← Back</a>
    <span id="hws-title">Plan</span>
    <span id="hws-status">Plan Room</span>
    <button type="button" id="hws-rotate" aria-label="Rotate page">Rotate page</button>
    <button type="button" id="hws-tools" aria-pressed="false">Tools</button>
    <button type="button" id="hws-close" aria-label="Close">×</button>
    <button type="button" id="hws-extract" aria-label="Extract page for takeoff">Extract</button>
    <button type="button" id="hws-sheets" aria-label="Sheet list">Sheets</button>
    <button type="button" id="hws-takeoff" aria-label="Tile and wall takeoff">Takeoff</button>
  </div>
  <div id="viewer"></div>
  <script src="./planindex.js"></script>
  <script src="./planview.js"></script>
  <script src="./extract.js"></script>
</body>
</html>
