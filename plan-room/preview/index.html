<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preview</title>
<style>
html,body{margin:0;height:100%;background:#1b1f27;color:#e8edf5}
#c{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 8px 24px}
canvas{max-width:100%;height:auto;background:#fff}
#msg{font:15px/1.4 -apple-system,Segoe UI,sans-serif;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="c"><div id="msg">Opening…</div></div>
<script type="module">
import * as pdfjs from "./vendor/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = new URL("./vendor/pdf.worker.min.mjs", import.meta.url).href;

let live = null;
function say(text) {
  const msg = document.getElementById("msg");
  if (msg) msg.textContent = text;
}

function pdfMagic(bytes) {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes instanceof ArrayBuffer ? bytes : (bytes && bytes.buffer) || new ArrayBuffer(0));
  const n = Math.min(data.length, 1024);
  for (let i = 0; i <= n - 5; i++) {
    if (data[i] === 0x25 && data[i + 1] === 0x50 && data[i + 2] === 0x44 && data[i + 3] === 0x46 && data[i + 4] === 0x2d) return true;
  }
  return false;
}

function quarter(deg) {
  const n = Math.round(Number(deg) / 90) * 90;
  if (!Number.isFinite(n)) return 0;
  return ((n % 360) + 360) % 360;
}

/* Default viewport rotation is page.rotate. Passing 0 would drop /Rotate. */
function viewportFor(page, scale, override) {
  return page.getViewport({ scale, rotation: quarter((page.rotate || 0) + (override || 0)) });
}

async function show(bytes) {
  if (!pdfMagic(bytes)) {
    say("This is not a PDF.");
    parent.postMessage({ type: "hws-pdf-error", message: "This is not a PDF.", notPdf: true }, location.origin);
    return;
  }
  const data = bytes instanceof ArrayBuffer ? new Uint8Array(bytes) : bytes;
  const doc = await pdfjs.getDocument({ data: data }).promise;
  live = doc;
  const c = document.getElementById("c");
  c.innerHTML = "";
  const width = Math.max(280, c.clientWidth || document.documentElement.clientWidth || 360);
  const pages = Math.min(doc.numPages, 12);
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i);
    const base = viewportFor(page, 1, 0);
    const vp = viewportFor(page, Math.min(2, (width - 16) / base.width), 0);
    const canvas = document.createElement("canvas");
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.dataset.rotate = String(quarter(page.rotate || 0));
    canvas.dataset.page = String(i);
    c.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  }
  parent.postMessage({ type: "hws-pdf-ready", pages: doc.numPages }, location.origin);
}

window.addEventListener("message", (ev) => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type !== "hws-pdf" || !d.bytes) return;
  show(d.bytes).catch(() => {
    say("This is not a PDF.");
    parent.postMessage({ type: "hws-pdf-error", message: "This is not a PDF.", notPdf: true }, location.origin);
  });
});
function bestTitle(items) {
  let best = "";
  (items || []).forEach((it) => {
    const s = String((it && it.str) || "").replace(/\s+/g, " ").trim();
    if (s.length < 4 || s.length > 60 || !/[A-Za-z]/.test(s)) return;
    if (/^(sheet|date|rev|revision|scale|drawn|checked|project|north|page)$/i.test(s)) return;
    if (s.length > best.length) best = s;
  });
  return best;
}
async function titles() {
  if (!live) return [];
  const out = [];
  for (let i = 1; i <= live.numPages; i++) {
    const content = await live.getPage(i).then((page) => page.getTextContent());
    out.push(bestTitle(content.items));
  }
  return out;
}
window.addEventListener("message", (ev) => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type !== "hws-pdf-titles") return;
  titles().then((list) => parent.postMessage({ type: "hws-pdf-titles", titles: list }, location.origin)).catch(() => {
    parent.postMessage({ type: "hws-pdf-titles", titles: [] }, location.origin);
  });
});
parent.postMessage({ type: "hws-pdf-listening" }, location.origin);
</script>
</body>
</html>
