 $('#root').innerHTML=topHtml('jobs')+`<main class="main hub-jobs" style="max-width:1400px;margin:0 auto"><div class="hph"><h1>Jobs</h1></div><div class="lcards"><div class="lcard"><div class="n">${L.jobs.length}</div><div class="b">Jobs</div><div class="small mut">each has its own schedule workspace</div></div>
 <div class="lcard red"><div class="n">${od}</div><div class="b">Overdue tasks</div><div class="small mut">not complete, past finish</div></div><div class="lcard red"><div class="n">${hi}</div><div class="b">High conflicts</div><div class="small mut">across all jobs</div></div>
 <div class="lcard"><div class="n">${L.jobs.filter(j=>j.tasks).length}</div><div class="b">Jobs with a schedule</div><div class="small mut">${L.jobs.filter(j=>j.bt).length} from Sample</div></div></div>
 <div class="panel"><h3>Job workspaces <span class="mut small">status date ${mdy(L.today)}</span><span class="sp"></span><input type="search" id="lq" placeholder="Find a job or trade (e.g. plumb)" value="${esc(st.lq||'')}"></h3><div class="pb"><div class="jgrid">
 ${jobs.map(j=>{const pe=STORE.pending(j.slug);const wm=q&&typeof wdMatchHtml=='function'?wdMatchHtml(j.slug,q):'';return `<a class="jcard" href="${jobHref(j.slug,wm?'whodid':'')}"${wm?` data-wdq="${esc(st.lq||'')}"`:''}><h4>${esc(j.name)}${pe?' '+chip(pe+' unsent','medium'):''}</h4><div class="small mut">${esc(j.address||'address not on file')}</div><div class="row"><span>${chip(j.stage||'—','low')}</span><span>${chip(j.bt_status=='in Sample'?'BT':'not in BT',j.bt_status=='in Sample'?'inbt':'notbt')}</span></div>
 <div class="row"><span>${j.start?mdy(j.start)+' → '+mdy(j.finish):'<span class="mut">no schedule yet</span>'}</span><span><span class="pbar" style="width:70px"><b style="width:${j.pct}%"></b></span> ${j.pct}%</span></div>
 <div class="row"><span class="mut">${j.tasks} tasks${j.pm?' · PM '+esc(j.pm):''}</span><span>${j.overdue?chip(j.overdue+' overdue','overdue'):''} ${j.high?chip(j.high+' high','high'):''}</span></div>
 ${j.next?`<div class="small mut" style="margin-top:4px">Next: ${md(j.next.date)} ${esc(j.next.task)}</div>`:''}${wm}</a>`}).join('')||emptyState('No jobs match','')}</div></div></div></main>`+gnavHtml('jobs');
 bindTop();document.querySelectorAll('.jcard[data-wdq]').forEach(a=>a.addEventListener('click',()=>{st.wdq=a.dataset.wdq;saveUi()}));const lq=$('#lq');lq.oninput=e=>{st.lq=e.target.value;saveUi();const p=lq.selectionStart;renderList();const n=$('#lq');n.focus();try{n.setSelectionRange(p,p)}catch(_){}};document.title='Harswells · Job workspaces'}
/* ---------- boot ---------- */
function route(){closeModal();if(!DATA)return;const p=parseHash();
 if(p.slug){if(!DATA.jobs[p.slug]){location.hash='#/';return}if(!J||J.slug!=p.slug)J=STORE.getJob(p.slug);L=null;renderJob();window.scrollTo(0,0)}
 else if(p.page=='jobs'){J=null;L=STORE.getList();renderList()}else{J=null;L=null;renderHub(p)}}
window.addEventListener('hashchange',route);
let lastPhone=isPhone();window.addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;if(!modalEl)route()}});
function openStore(){const live=liveOn();STORE=HWSStore.create({data:DATA,live,version:MODE==='share'?B.version:(live?'pwa-live':'pwa-'+String(DATA.built).replace(/[^0-9A-Za-z]+/g,'')),extra:DATA.extra,onSaveError:e=>toast('Could not save in this browser: '+e.message+' (export your changes)')})}
/* ---------- live mode (instant sync, live.js) ---------- */
let LIVE=null,rrT=null,ptrDown=false;
['pointerdown','touchstart'].forEach(t=>document.addEventListener(t,()=>{ptrDown=true},true));['pointerup','pointercancel','touchend','touchcancel'].forEach(t=>document.addEventListener(t,()=>{setTimeout(()=>{ptrDown=false},50)},true));
function relTime(ms){const s=Math.max(0,(Date.now()-ms)/1000);if(s<45)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';const d=new Date(ms);const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});return (s<20*3600?'at ':d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',timeZone:'America/Phoenix'})+' ')+t}
function liveBadge(slug){const s=LIVE?LIVE.status():{state:'connecting'};const q=STORE?STORE.pendingTotal():0;
 if(!navigator.onLine||s.state=='offline')return `<span class="lv off">● Offline</span>${q?` · ${q} edit${q>1?'s':''} waiting, sent when back online`:' · showing the last copy on this device'}`;
 if(s.state=='saving'||s.state=='pending')return `<span class="lv sv">● Saving…</span>`;
 if(s.state=='error')return `<span class="lv err">● Not saved yet</span> · retrying${q?` (${q} waiting)`:''}`;
 if(s.state=='connecting')return `<span class="lv sv">● Connecting…</span>`;
 if(!slug&&document.body.classList.contains('hubp'))return `<span class="lv on">● Live</span> · shared Harswells Dropbox`;const i=STORE?STORE.liveInfo(slug):null;const upd=i&&i.ms?` · Updated ${relTime(i.ms)}${i.by?' by '+esc(i.by):''}`:'';
 return `<span class="lv on">● Live</span>${upd}`}
function paintLive(){document.querySelectorAll('#livepill').forEach(x=>{x.innerHTML=liveBadge(J&&J.slug)});const sb=document.getElementById('syncbar');if(sb&&window.WSData&&WSData.liveMode){sb.innerHTML=WSData.statusHtml();WSData.bind()}}
setInterval(()=>{if(LIVE)paintLive()},20000);
function busyTyping(){if(modalEl||ptrDown)return true;const a=document.activeElement;const r=document.getElementById('root');return !!(a&&a!==document.body&&r&&r.contains(a)&&(a.tagName=='TEXTAREA'||a.tagName=='SELECT'||(a.tagName=='INPUT'&&!/^(checkbox|radio|button|submit|range|color)$/.test(a.type))))}
/* re-render after a remote change without touching an open edit sheet or a field someone is typing in (retries until they are done) */
function safeRender(){clearTimeout(rrT);if(busyTyping()){rrT=setTimeout(safeRender,700);return}if(!DATA||!STORE)return;const p=parseHash();const y=window.scrollY;
 if(p.slug&&DATA.jobs[p.slug]){J=STORE.getJob(p.slug);renderJob()}else if(!p.slug){J=null;if(p.page=='jobs'){L=STORE.getList();renderList()}else{renderHub(p)}}window.scrollTo(0,y)}
function dataUpdated(){const pend=STORE?STORE.pendingTotal():0;DATA=WSData.data();openStore();if(!STORE.live&&pend&&!STORE.pendingTotal())toast('New data arrived; open “Changes” to bring your unsent edits over');J=null;if(LIVE)safeRender();else route()}
function startLive(){if(!liveOn()||!STORE||!STORE.live){if(window.WSData)WSData.liveMode=false;return}if(!STORE.who()&&SY.A.who)STORE.setWho(SY.A.who());if(LIVE)return;
 if(window.WSData)WSData.liveMode=true;
 LIVE=HWSLive.create({A:SY.A,store:()=>STORE,data:()=>DATA,who:()=>STORE&&STORE.who(),onStatus:()=>paintLive(),
  onChange:(slugs,why)=>{const p=parseHash();if(why=='saved'){paintLive();if(p.slug&&slugs.includes(p.slug)&&J&&J.pending){safeRender()}return}if(!p.slug||slugs.includes(p.slug))safeRender();paintLive()},
  onSnapshot:async()=>{if(window.WSData)await WSData.sync(true)}});
 window.LIVE_DBG=LIVE;LIVE.start()}
async function boot(){try{
  await syncRedirect();
  if(MODE==='share'){const el=document.getElementById('hws-data');DATA=JSON.parse(el.textContent);el.textContent='';}
  else{await WSData.init();WSData.onUpdate=dataUpdated;DATA=WSData.data();
   if(!DATA){$('#root').innerHTML=topHtml()+`<div class="main">${WSData.errorHtml({message:'setup'})}</div>`;WSData.bind();await syncBoot();return}}
  await syncBoot();openStore();route();startLive();
 }catch(e){console.error(e);$('#root').innerHTML='<div class="empty"><b>Could not start the app.</b>'+esc(e.message)+'</div>'}}
if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
